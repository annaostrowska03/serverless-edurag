<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduRAG - AI Knowledge Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        .ai-bubble p              { margin-bottom: 0.5rem; }
        .ai-bubble p:last-child   { margin-bottom: 0; }
        .ai-bubble strong         { font-weight: 700; }
        .ai-bubble em             { font-style: italic; }
        .ai-bubble ul             { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .ai-bubble ol             { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .ai-bubble li             { margin-bottom: 0.2rem; }
        .ai-bubble h1             { font-size: 1.2em; font-weight: 700; margin-bottom: 0.4rem; }
        .ai-bubble h2             { font-size: 1.1em; font-weight: 700; margin-bottom: 0.4rem; }
        .ai-bubble h3             { font-size: 1.05em; font-weight: 600; margin-bottom: 0.3rem; }
        .ai-bubble code           { background: rgba(255,255,255,.2); border-radius: 3px; padding: .1em .3em; font-family: monospace; font-size: .9em; }
        .ai-bubble pre            { background: rgba(0,0,0,.25); border-radius: 6px; padding: .75rem; margin-bottom: .5rem; overflow-x: auto; }
        .ai-bubble pre code       { background: transparent; padding: 0; }
        .ai-bubble blockquote     { border-left: 3px solid rgba(255,255,255,.4); padding-left: .75rem; opacity: .85; margin-bottom: .5rem; }
        .src-toggle               { cursor: pointer; user-select: none; list-style: none; }
        .src-toggle::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans overflow-hidden" style="height:100dvh">

<div id="login-screen" class="h-full flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm mx-4">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600">EduRAG</h1>
            <p class="text-slate-400 text-sm mt-1">AI-powered knowledge base</p>
        </div>

        <div class="flex rounded-xl bg-slate-100 p-1 mb-5">
            <button type="button" id="tab-signin" onclick="switchTab('signin')"
                    class="flex-1 text-sm font-semibold py-1.5 rounded-lg bg-white shadow-sm text-slate-800 transition">
                Sign in
            </button>
            <button type="button" id="tab-register" onclick="switchTab('register')"
                    class="flex-1 text-sm font-semibold py-1.5 rounded-lg text-slate-500 transition">
                Register
            </button>
        </div>

        <div class="space-y-3">
            <input type="text" id="auth-name" placeholder="Username"
                   class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm
                          focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
            <input type="password" id="auth-password" placeholder="Password"
                   class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm
                          focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
        </div>

        <p id="auth-error" class="text-red-500 text-xs mt-2 hidden"></p>

        <button type="button" id="auth-submit-btn" onclick="submitAuth()"
                class="mt-4 w-full bg-blue-600 text-white text-sm font-semibold py-2.5 rounded-xl
                       hover:bg-blue-700 transition shadow-sm">
            Sign in
        </button>

    </div>
</div>

<div id="app" class="hidden h-full flex flex-col">
    <header class="bg-blue-600 text-white px-5 py-3 shadow-md flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight">EduRAG</h1>
            <span class="text-xs opacity-50 hidden sm:block ml-1">Serverless AI Knowledge Base</span>
        </div>
        <div class="flex items-center gap-3">
            <img id="user-avatar" class="w-8 h-8 rounded-full border-2 border-white/30 hidden" src="" alt="">
            <span id="user-name" class="text-sm font-medium hidden sm:block"></span>
            <button onclick="signOut()"
                    class="text-xs bg-white/10 hover:bg-white/25 rounded-lg px-3 py-1.5 transition">
                Sign out
            </button>
        </div>
    </header>

    <main class="flex-grow flex gap-3 p-3 overflow-hidden min-h-0">
        <aside class="w-72 flex-shrink-0 bg-white rounded-xl shadow-sm flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex-shrink-0">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Upload Document</h2>

                <label class="text-xs text-slate-400 mb-1 block">Subject / Folder</label>
                <input type="text" id="subject-input" list="subjects-datalist"
                       placeholder="e.g. Mathematics"
                       class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2
                              focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                <datalist id="subjects-datalist"></datalist>

                <div id="drop-zone"
                     class="border-2 border-dashed border-blue-200 rounded-lg p-3 text-center
                            hover:bg-blue-50 hover:border-blue-400 transition cursor-pointer mb-2">
                    <input type="file" id="file-input" class="hidden" accept=".pdf">
                    <label for="file-input" class="cursor-pointer block">
                        <div class="text-blue-400 text-xl mb-0.5">PDF</div>
                        <span id="file-label" class="text-blue-600 text-xs font-medium">Browse PDF file</span>
                    </label>
                </div>

                <button onclick="uploadFile()" id="upload-btn"
                        class="w-full bg-blue-600 text-white text-sm font-semibold py-2 rounded-lg
                               hover:bg-blue-700 disabled:opacity-40 transition shadow-sm"
                        disabled>
                    Upload
                </button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 min-h-0">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Documents</h3>
                    <div class="flex gap-2 text-xs">
                        <button onclick="selectAll()" class="text-blue-500 hover:text-blue-700 transition">All</button>
                        <span class="text-slate-300">|</span>
                        <button onclick="deselectAll()" class="text-slate-400 hover:text-slate-600 transition">None</button>
                    </div>
                </div>
                <div id="doc-list">
                    <p class="text-xs text-slate-400 italic text-center py-6 leading-relaxed">
                        No documents yet.<br>Upload a PDF to get started.
                    </p>
                </div>
            </div>
        </aside>

        <section class="flex-grow bg-white rounded-xl shadow-sm flex flex-col overflow-hidden min-w-0">
            <div id="selection-bar"
                 class="px-4 py-2 border-b border-slate-100 bg-slate-50 text-xs text-slate-500
                        flex items-center gap-2 flex-shrink-0">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span id="selection-info">No documents selected — select from the left panel</span>
                <button onclick="clearChat()"
                        class="ml-auto text-slate-300 hover:text-slate-500 transition flex-shrink-0"
                        title="Clear chat">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>

            <div id="chat-history" class="flex-grow p-4 overflow-y-auto space-y-4 bg-slate-50 min-h-0">
                <div class="flex items-start">
                    <div class="bg-blue-600 text-white rounded-2xl rounded-tl-sm px-4 py-3
                                max-w-[85%] shadow-sm text-sm leading-relaxed">
                        Hello! I'm EduRAG. Select documents from the left panel, then ask me anything about them.
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-white flex gap-2 flex-shrink-0">
                <input type="text" id="question-input"
                       class="flex-grow border border-slate-200 rounded-xl px-4 py-2.5 text-sm
                              focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
                       placeholder="Ask a question about your documents...">
                <button id="ask-btn"
                        class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold
                               hover:bg-blue-700 disabled:opacity-40 transition shadow-sm">
                    Send
                </button>
            </div>
        </section>
    </main>
</div>

<script>
const API_URL = CONFIG.API_URL;

let currentTab = 'signin';
let currentUser = null;
let unsubscribeDocListener = null;
let userDocuments = {};
let selectedDocIds = new Set();
let conversationHistory = [];
let selectedFile = null;

firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
const auth = firebase.auth();
const firestoreDb = firebase.firestore();

const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const chatHistory = document.getElementById('chat-history');
const questionInput = document.getElementById('question-input');
const askBtn = document.getElementById('ask-btn');

marked.setOptions({ breaks: true });

const STATUS_COLOR = {
    Ready: 'text-green-500',
    Failed: 'text-red-400',
    Uploading: 'text-slate-400',
    Downloading: 'text-blue-400',
    Chunking: 'text-blue-400',
    Vectorizing: 'text-blue-500',
};

const STATUS_EMOJI = {
    Ready: 'OK',
    Failed: 'ERR',
    Uploading: 'UP',
    Downloading: 'DL',
    Chunking: 'CH',
    Vectorizing: 'VEC',
};

function esc(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function switchTab(tab) {
    currentTab = tab;
    const isRegister = tab === 'register';
    document.getElementById('tab-signin').className =
        `flex-1 text-sm font-semibold py-1.5 rounded-lg transition ${!isRegister ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`;
    document.getElementById('tab-register').className =
        `flex-1 text-sm font-semibold py-1.5 rounded-lg transition ${isRegister ? 'bg-white shadow-sm text-slate-800' : 'text-slate-500'}`;
    document.getElementById('auth-submit-btn').textContent = isRegister ? 'Create account' : 'Sign in';
    clearAuthError();
}

function toEmail(username) {
    return username.toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@edurag.app';
}

function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
}

function clearAuthError() {
    document.getElementById('auth-error').classList.add('hidden');
}

async function submitAuth() {
    const name = document.getElementById('auth-name').value.trim();
    const password = document.getElementById('auth-password').value;
    clearAuthError();

    if (!name) return showAuthError('Please enter a username.');
    if (password.length < 6) return showAuthError('Password must be at least 6 characters.');

    const email = toEmail(name);
    const btn = document.getElementById('auth-submit-btn');
    btn.disabled = true;

    try {
        if (currentTab === 'register') {
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            await cred.user.updateProfile({ displayName: name });
        } else {
            await auth.signInWithEmailAndPassword(email, password);
        }
    } catch (err) {
        const msgs = {
            'auth/email-already-in-use': 'Username already taken.',
            'auth/user-not-found': 'Username not found.',
            'auth/wrong-password': 'Wrong password.',
            'auth/invalid-credential': 'Wrong username or password.',
            'auth/weak-password': 'Password too weak (min 6 chars).',
        };
        showAuthError(msgs[err.code] || err.message);
    } finally {
        btn.disabled = false;
    }
}

['auth-name', 'auth-password'].forEach(id => {
    document.getElementById(id).addEventListener('keypress', event => {
        if (event.key === 'Enter') submitAuth();
    });
});

auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        const avatar = document.getElementById('user-avatar');
        if (user.photoURL) {
            avatar.src = user.photoURL;
            avatar.classList.remove('hidden');
        } else {
            avatar.classList.add('hidden');
        }
        document.getElementById('user-name').textContent = user.displayName || '';
        startDocumentListener();
    } else {
        currentUser = null;
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
        if (unsubscribeDocListener) {
            unsubscribeDocListener();
            unsubscribeDocListener = null;
        }
        userDocuments = {};
        selectedDocIds.clear();
        renderDocumentList();
        updateSelectionBar();
    }
});

function signOut() {
    auth.signOut();
}

function makeFormBody(payload) {
    const body = new URLSearchParams();
    Object.entries(payload).forEach(([key, value]) => {
        body.set(key, typeof value === 'string' ? value : JSON.stringify(value));
    });
    return body;
}

async function getIdToken() {
    if (!currentUser) throw new Error('Not signed in');
    return currentUser.getIdToken();
}

async function apiFetch(path, { method = 'GET', query = {}, form = null } = {}) {
    const url = new URL(`${API_URL}${path}`);
    Object.entries(query).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
            url.searchParams.set(key, value);
        }
    });

    const options = { method };
    if (form) {
        options.body = makeFormBody(form);
    }

    return fetch(url.toString(), options);
}

function startDocumentListener() {
    if (unsubscribeDocListener) unsubscribeDocListener();
    unsubscribeDocListener = firestoreDb
        .collection('users').doc(currentUser.uid)
        .collection('documents')
        .onSnapshot(snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === 'removed') {
                    delete userDocuments[change.doc.id];
                    selectedDocIds.delete(change.doc.id);
                    return;
                }

                const prev = userDocuments[change.doc.id];
                const next = { id: change.doc.id, ...change.doc.data() };
                userDocuments[change.doc.id] = next;
                if (next.status === 'Ready' && (!prev || prev.status !== 'Ready')) {
                    selectedDocIds.add(change.doc.id);
                }
            });
            renderDocumentList();
            updateSelectionBar();
            updateSubjectDatalist();
        });
}

function renderDocumentList() {
    const el = document.getElementById('doc-list');
    const docs = Object.values(userDocuments);

    if (docs.length === 0) {
        el.innerHTML = '<p class="text-xs text-slate-400 italic text-center py-6 leading-relaxed">No documents yet.<br>Upload a PDF to get started.</p>';
        return;
    }

    const bySubject = {};
    docs.forEach(doc => {
        const subject = doc.subject || 'General';
        (bySubject[subject] = bySubject[subject] || []).push(doc);
    });

    el.innerHTML = Object.entries(bySubject)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([subject, docsInSubject]) => {
            const readyDocs = docsInSubject.filter(doc => doc.status === 'Ready');
            const allSelected = readyDocs.length > 0 && readyDocs.every(doc => selectedDocIds.has(doc.id));
            const safeSubject = JSON.stringify(subject);
            return `
            <div class="mb-4">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">${esc(subject)}</span>
                    <button onclick="toggleSubject(${safeSubject})"
                            class="text-xs text-slate-400 hover:text-blue-500 transition">
                        ${allSelected ? 'none' : 'all'}
                    </button>
                </div>
                <div class="space-y-0.5">
                    ${docsInSubject.map(renderDocItem).join('')}
                </div>
            </div>`;
        })
        .join('');
}

function renderDocItem(doc) {
    const ready = doc.status === 'Ready';
    const selected = selectedDocIds.has(doc.id);
    const color = STATUS_COLOR[doc.status] || 'text-slate-400';
    const emoji = STATUS_EMOJI[doc.status] || '...';
    const safeId = JSON.stringify(doc.id);

    return `
    <div class="flex items-start gap-1 px-2 py-1.5 rounded-lg hover:bg-slate-50 transition group ${!ready ? 'opacity-55' : ''}">
        <label class="flex items-start gap-2 flex-1 min-w-0 cursor-pointer">
            <input type="checkbox"
                   ${selected ? 'checked' : ''}
                   ${!ready ? 'disabled' : ''}
                   onchange="toggleDoc(${safeId}, this.checked)"
                   class="mt-0.5 w-3.5 h-3.5 accent-blue-600 flex-shrink-0">
            <div class="flex-1 min-w-0">
                <div class="text-sm font-medium text-slate-700 truncate"
                     title="${esc(doc.filename || doc.id)}">${esc(doc.filename || doc.id)}</div>
                <div class="text-xs ${color} flex items-center gap-1">
                    ${emoji} ${esc(doc.status || 'Unknown')}${doc.total_chunks ? ` · ${doc.total_chunks} chunks` : ''}
                </div>
            </div>
        </label>
        <button onclick="deleteDoc(${safeId})"
                title="Delete document"
                class="opacity-0 group-hover:opacity-100 transition text-slate-300 hover:text-red-400 flex-shrink-0 mt-0.5 p-0.5 rounded">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
    </div>`;
}

async function deleteDoc(docId) {
    if (!confirm('Delete this document? This cannot be undone.')) return;

    try {
        const idToken = await getIdToken();
        const res = await apiFetch(`/documents/${encodeURIComponent(docId)}`, {
            method: 'POST',
            form: { id_token: idToken },
        });
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Delete failed');
        }
    } catch (err) {
        alert(`Delete failed: ${err.message}`);
    }
}

function toggleDoc(docId, checked) {
    checked ? selectedDocIds.add(docId) : selectedDocIds.delete(docId);
    updateSelectionBar();
}

function toggleSubject(subject) {
    const readyDocs = Object.values(userDocuments).filter(doc => (doc.subject || 'General') === subject && doc.status === 'Ready');
    const allSelected = readyDocs.every(doc => selectedDocIds.has(doc.id));
    readyDocs.forEach(doc => {
        allSelected ? selectedDocIds.delete(doc.id) : selectedDocIds.add(doc.id);
    });
    renderDocumentList();
    updateSelectionBar();
}

function selectAll() {
    Object.values(userDocuments)
        .filter(doc => doc.status === 'Ready')
        .forEach(doc => selectedDocIds.add(doc.id));
    renderDocumentList();
    updateSelectionBar();
}

function deselectAll() {
    selectedDocIds.clear();
    renderDocumentList();
    updateSelectionBar();
}

function updateSelectionBar() {
    const count = selectedDocIds.size;
    const infoEl = document.getElementById('selection-info');
    if (count === 0) {
        infoEl.textContent = 'No documents selected — select from the left panel';
        return;
    }
    const subjects = [...new Set(
        [...selectedDocIds].map(id => userDocuments[id]?.subject || 'General')
    )];
    infoEl.textContent = `${count} document${count !== 1 ? 's' : ''} selected · ${subjects.join(', ')}`;
}

function updateSubjectDatalist() {
    const subjects = [...new Set(Object.values(userDocuments).map(doc => doc.subject || 'General'))];
    document.getElementById('subjects-datalist').innerHTML =
        subjects.map(subject => `<option value="${esc(subject)}">`).join('');
}

fileInput.addEventListener('change', event => {
    if (event.target.files.length > 0) {
        selectedFile = event.target.files[0];
        uploadBtn.disabled = false;
        document.getElementById('file-label').textContent = selectedFile.name;
    }
});

async function uploadFile() {
    if (!selectedFile || !currentUser) return;
    const subject = document.getElementById('subject-input').value.trim() || 'General';

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';

    try {
        const idToken = await getIdToken();
        const urlRes = await apiFetch('/generate-upload-url', {
            method: 'GET',
            query: {
                filename: selectedFile.name,
                subject,
                token: idToken,
            },
        });
        const urlData = await urlRes.json();
        if (!urlRes.ok) throw new Error(urlData.error || 'Failed to get upload URL');

        const putRes = await fetch(urlData.upload_url, {
            method: 'PUT',
            body: selectedFile,
            headers: { 'Content-Type': 'application/pdf' },
        });
        if (!putRes.ok) throw new Error('Failed to upload to Cloud Storage');
    } catch (err) {
        alert(`Upload failed: ${err.message}`);
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
        fileInput.value = '';
        document.getElementById('file-label').textContent = 'Browse PDF file';
        selectedFile = null;
    }
}

askBtn.addEventListener('click', askQuestion);
questionInput.addEventListener('keypress', event => {
    if (event.key === 'Enter') askQuestion();
});

function clearChat() {
    conversationHistory = [];
    chatHistory.innerHTML = `
        <div class="flex items-start">
            <div class="bg-blue-600 text-white rounded-2xl rounded-tl-sm px-4 py-3
                        max-w-[85%] shadow-sm text-sm leading-relaxed">
                Hello! I'm EduRAG. Select documents from the left panel, then ask me anything about them.
            </div>
        </div>`;
}

function appendUserMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'flex items-start justify-end';
    const msg = document.createElement('div');
    msg.className = 'bg-slate-200 text-slate-800 rounded-2xl rounded-tr-sm px-4 py-3 max-w-[85%] shadow-sm text-sm leading-relaxed';
    msg.innerText = text;
    wrap.appendChild(msg);
    chatHistory.appendChild(wrap);
    chatHistory.scrollTop = chatHistory.scrollHeight;
}

function createAiBubble() {
    const wrap = document.createElement('div');
    wrap.className = 'flex items-start gap-2 group';

    const msg = document.createElement('div');
    msg.className = 'bg-blue-600 text-white rounded-2xl rounded-tl-sm px-4 py-3 max-w-[85%] shadow-sm text-sm leading-relaxed ai-bubble';

    const copyBtn = document.createElement('button');
    copyBtn.title = 'Copy';
    copyBtn.className = 'opacity-0 group-hover:opacity-100 transition self-start mt-1 text-slate-300 hover:text-blue-500 flex-shrink-0';
    copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    </svg>`;
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(msg.innerText).then(() => {
            copyBtn.innerHTML = `<svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>`;
            setTimeout(() => {
                copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>`;
            }, 1500);
        });
    });

    wrap.appendChild(msg);
    wrap.appendChild(copyBtn);
    chatHistory.appendChild(wrap);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return msg;
}

function appendSources(bubble, sources) {
    if (!sources || sources.length === 0) return;
    const details = document.createElement('details');
    details.className = 'mt-3 pt-2 border-t border-white/20 text-xs';
    details.innerHTML = `
        <summary class="src-toggle flex items-center gap-1.5 opacity-60 hover:opacity-100 transition">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Sources (${sources.length})
        </summary>
        <div class="mt-2 space-y-2">
            ${sources.map(source => `
            <div class="bg-white/10 rounded-lg p-2 leading-relaxed">
                <div class="font-semibold flex items-center gap-1 flex-wrap">
                    ${esc(source.filename)}
                    ${source.subject ? `<span class="opacity-50 font-normal">· ${esc(source.subject)}</span>` : ''}
                    <span class="opacity-50 font-normal">· p.${source.page}</span>
                </div>
                <div class="mt-1 opacity-70 italic">"${esc(source.excerpt)}..."</div>
            </div>`).join('')}
        </div>`;
    bubble.appendChild(details);
}

async function askQuestion() {
    const question = questionInput.value.trim();
    if (!question || !currentUser) return;

    if (selectedDocIds.size === 0) {
        const originalPlaceholder = questionInput.placeholder;
        questionInput.placeholder = 'Select at least one document first';
        questionInput.classList.add('border-amber-400', 'ring-1', 'ring-amber-400');
        setTimeout(() => {
            questionInput.placeholder = originalPlaceholder;
            questionInput.classList.remove('border-amber-400', 'ring-1', 'ring-amber-400');
        }, 2000);
        return;
    }

    appendUserMessage(question);
    questionInput.value = '';
    askBtn.disabled = true;

    const bubble = createAiBubble();
    bubble.innerHTML = '<span class="animate-pulse tracking-widest opacity-50">...</span>';

    try {
        const idToken = await getIdToken();
        const response = await apiFetch('/ask', {
            method: 'POST',
            form: {
                id_token: idToken,
                question,
                doc_ids: [...selectedDocIds],
                history: conversationHistory,
            },
        });

        if (!response.ok) {
            const err = await response.json();
            bubble.innerHTML = `<span class="opacity-80">Error: ${esc(err.error || 'Unknown error')}</span>`;
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';
        let sourcesRendered = false;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                    const data = JSON.parse(line.slice(6));
                    if (data.token !== undefined) {
                        fullText += data.token;
                        bubble.innerHTML = marked.parse(fullText);
                        chatHistory.scrollTop = chatHistory.scrollHeight;
                    } else if (data.sources && !sourcesRendered) {
                        sourcesRendered = true;
                        appendSources(bubble, data.sources);
                        chatHistory.scrollTop = chatHistory.scrollHeight;
                    } else if (data.error) {
                        bubble.innerHTML = `<span class="opacity-80">Error: ${esc(data.error)}</span>`;
                    }
                } catch {
                }
            }
        }

        if (fullText) {
            conversationHistory.push({ role: 'user', content: question });
            conversationHistory.push({ role: 'assistant', content: fullText });
            if (conversationHistory.length > 6) {
                conversationHistory = conversationHistory.slice(-6);
            }
        }
    } catch (err) {
        bubble.innerHTML = `<span class="opacity-80">Error: ${esc(err.message)}</span>`;
    } finally {
        askBtn.disabled = false;
        questionInput.focus();
    }
}
</script>
